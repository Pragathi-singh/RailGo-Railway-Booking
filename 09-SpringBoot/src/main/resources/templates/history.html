<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="page container"><p class="eyebrow">BOOKINGS</p><h1>Your journey history.</h1><div class="empty-state" th:if="${#lists.isEmpty(bookings)}"><div class="empty-icon">⌁</div><h2>No bookings yet</h2><p>Your completed journeys will appear here when booking services are connected.</p><a class="button" th:href="@{/}">Plan a journey</a></div><div class="booking-list" th:unless="${#lists.isEmpty(bookings)}"><article class="profile-card" th:each="booking : ${bookings}"><h2 th:text="${booking.origin + ' to ' + booking.destination}"></h2><p th:text="${booking.journeyDate + ' · ' + booking.travelClass}"></p></article></div></main></html>
