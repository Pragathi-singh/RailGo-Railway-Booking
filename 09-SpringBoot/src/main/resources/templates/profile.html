<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="page container"><p class="eyebrow">PROFILE</p><h1>Your account details.</h1><form th:action="@{/profile}" th:object="${form}" method="post" class="profile-form"><div class="field"><label for="name">Full name</label><input id="name" th:field="*{name}" th:value="${user.name}" required><span class="error" th:errors="*{name}"></span></div><div class="field"><label for="email">Email address</label><input id="email" th:value="${user.email}" readonly></div><div class="field"><label for="mobile">Mobile number</label><input id="mobile" th:field="*{mobile}" th:value="${user.mobile}" required><span class="error" th:errors="*{mobile}"></span></div><button class="button" type="submit">Save changes</button></form></main></html>
