<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title ?: 'RailGo | Your Journey, Our Priority'}">RailGo</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="site-header"><nav class="navbar container"><a class="brand" th:href="@{/}"><span class="brand-mark">R</span><span>Rail<span>Go</span></span></a><div class="nav-links"><a th:href="@{/}">Home</a><a th:href="@{/#search}">Trains</a><span th:if="${#authorization.expression('isAuthenticated()')}"><a th:href="@{/dashboard}">My account</a><a th:href="@{/history}">Bookings</a><form th:action="@{/logout}" method="post" class="inline-form"><button class="nav-logout" type="submit">Log out</button></form></span><span th:unless="${#authorization.expression('isAuthenticated()')}"><a th:href="@{/login}">Sign in</a><a class="button button--small" th:href="@{/signup}">Create account</a></span></div></nav></header><div class="flash-wrap container"><p class="flash success" th:if="${success}" th:text="${success}"></p><p class="flash alert" th:if="${error}" th:text="${error}"></p></div><main th:fragment="layout(content)" th:replace="${content}"></main><footer class="footer"><div class="container footer-content"><div><a class="brand" th:href="@{/}"><span class="brand-mark">R</span><span>Rail<span>Go</span></span></a><p>Your Journey, Our Priority</p></div><div><a th:href="@{/#search}">Search trains</a><a th:href="@{/forgot-password}">Password help</a></div><p>Thoughtful journeys begin with a simpler way to plan.</p></div></footer><script th:src="@{/js/script.js}" defer></script></body></html>
