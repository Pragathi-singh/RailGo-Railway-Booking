<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="auth-page"><aside class="auth-visual"><a class="brand" th:href="@{/}"><span class="brand-mark">R</span><span>Rail<span>Go</span></span></a><div><p class="eyebrow eyebrow-light">BEGIN YOUR JOURNEY</p><h2>Make every mile meaningful.</h2><p>Create a profile for a simpler way to plan the journeys ahead.</p></div></aside><section class="auth-panel"><div class="auth-form-wrap"><a class="back" th:href="@{/}">← Back to home</a><p class="eyebrow">CREATE ACCOUNT</p><h1>Create your account.</h1><p class="muted">Join RailGo and keep your journey details together.</p><form th:action="@{/signup}" th:object="${form}" method="post" class="auth-form"><div class="field"><label for="name">Full name</label><input id="name" th:field="*{name}" required><span class="error" th:errors="*{name}"></span></div><div class="field"><label for="email">Email address</label><input id="email" type="email" th:field="*{email}" required><span class="error" th:errors="*{email}"></span></div><div class="field"><label for="mobile">Mobile number</label><input id="mobile" th:field="*{mobile}" required><span class="error" th:errors="*{mobile}"></span></div><div class="field"><label for="password">Password</label><input id="password" type="password" th:field="*{password}" required><span class="error" th:errors="*{password}"></span></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" th:field="*{confirmPassword}" required><span class="error" th:errors="*{confirmPassword}"></span></div><button class="button full" type="submit">Create account</button><p class="auth-switch">Already have an account? <a th:href="@{/login}">Sign in</a></p></form></div></section></main></html>
