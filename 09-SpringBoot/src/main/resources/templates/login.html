<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="auth-page"><aside class="auth-visual"><a class="brand" th:href="@{/}"><span class="brand-mark">R</span><span>Rail<span>Go</span></span></a><div><p class="eyebrow eyebrow-light">WELCOME BACK</p><h2>Continue your journey with ease.</h2><p>Access your saved profile and keep your travel plans close.</p></div></aside><section class="auth-panel"><div class="auth-form-wrap"><a class="back" th:href="@{/}">← Back to home</a><p class="eyebrow">SIGN IN</p><h1>Welcome back.</h1><p class="muted">Sign in to continue your journey.</p><p class="success" th:if="${success}" th:text="${success}"></p><form th:action="@{/login}" method="post" class="auth-form"><div class="field"><label for="email">Email address</label><input id="email" name="username" type="email" required></div><div class="field"><label for="password">Password</label><div class="password"><input id="password" name="password" type="password" required><button type="button" data-password="#password">Show</button></div></div><p class="alert" th:if="${error}" th:text="${error}"></p><button class="button full" type="submit">Sign in</button><p class="auth-switch">Need an account? <a th:href="@{/signup}">Create your account</a></p><p class="auth-switch"><a th:href="@{/forgot-password}">Forgot your password?</a></p></form></div></section></main></html>
