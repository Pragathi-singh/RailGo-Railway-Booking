spring.datasource.url=${RAILGO_DB_URL:jdbc:mysql://127.0.0.1:3306/railgo_springboot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8}
spring.datasource.username=${RAILGO_DB_USER:railgo_phase2}
spring.datasource.password=${RAILGO_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${RAILGO_COOKIE_SECURE:false}
railgo.secret=${RAILGO_SECRET:local-development-secret-change-me}
