spring.datasource.url=${RAILGO_DB_URL:jdbc:h2:file:./data/railgo}
spring.datasource.username=${RAILGO_DB_USER:sa}
spring.datasource.password=${RAILGO_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${RAILGO_COOKIE_SECURE:false}
railgo.secret=${RAILGO_SECRET:local-development-secret-change-me}
