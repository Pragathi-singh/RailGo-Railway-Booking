{% extends "auth.html" %}{% block title %}Sign in | RailGo{% endblock %}{% block auth_content %}<p class="eyebrow">SIGN IN</p><h1>Welcome back.</h1><p class="muted">Sign in to continue your journey.</p><form method="post" class="auth-form" novalidate><input type="hidden" name="csrf" value="{{ csrf_token() }}"><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" required></div><div class="field"><label for="password">Password</label><div class="password"><input id="password" name="password" type="password" required><button type="button" data-password="#password">Show</button></div></div>{% if errors.form %}<p class="alert">{{ errors.form }}</p>{% endif %}<button class="button full" type="submit">Sign in</button><p class="auth-switch">Need an account? <a href="{{ url_for('main.signup') }}">Create your account</a></p><p class="auth-switch"><a href="{{ url_for('main.forgot_password') }}">Forgot your password?</a></p></form>{% endblock %}
