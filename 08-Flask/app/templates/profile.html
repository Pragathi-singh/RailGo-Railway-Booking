{% extends "base.html" %}{% block title %}Profile | RailGo{% endblock %}{% block content %}<main class="page container"><p class="eyebrow">PROFILE</p><h1>Your account details.</h1><form method="post" class="profile-form"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><div class="field"><label for="name">Full name</label><input id="name" name="name" value="{{ user.name }}" required>{% if errors.name %}<span class="error">{{ errors.name }}</span>{% endif %}</div><div class="field"><label for="email">Email address</label><input id="email" value="{{ user.email }}" readonly></div><div class="field"><label for="mobile">Mobile number</label><input id="mobile" name="mobile" value="{{ user.mobile }}" required>{% if errors.mobile %}<span class="error">{{ errors.mobile }}</span>{% endif %}</div><button class="button" type="submit">Save changes</button></form></main>{% endblock %}
