<main class="form-page container"><p class="eyebrow">PROFILE</p><h1>Your account details.</h1><form name="profileForm" class="profile-form" ng-submit="update(profileForm)" novalidate><div class="field"><label for="profileName">Full name</label><input id="profileName" name="name" ng-model="profile.name" required></div><div class="field"><label for="profileEmail">Email address</label><input id="profileEmail" ng-model="profile.email" readonly></div><div class="field"><label for="profileMobile">Mobile number</label><input id="profileMobile" name="mobile" ng-model="profile.mobile" required></div><p class="success" ng-if="success">{{success}}</p><p class="alert" ng-if="error">{{error}}</p><button class="button" type="submit">Save changes</button></form></main>
