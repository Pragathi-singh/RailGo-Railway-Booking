<main class="auth-page"><aside class="auth-visual"><a class="brand" href="#/"><span class="brand-mark">R</span><span>Rail<span>Go</span></span></a><div class="auth-visual-copy"><p class="eyebrow eyebrow-light">WELCOME BACK</p><h2>Continue your journey with ease.</h2><p>Access your saved profile and keep your travel plans close.</p></div></aside><section class="auth-panel"><div class="auth-form-wrap"><a class="back" href="#/">← Back to home</a><p class="eyebrow">SIGN IN</p><h1>Welcome back.</h1><p class="muted">Sign in to continue your journey.</p><form name="loginForm" class="auth-form" ng-submit="login(loginForm)" novalidate><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" ng-model="form.email" required><span class="error" ng-if="submitted && loginForm.email.$invalid">Enter a valid email address.</span></div><div class="field"><label for="password">Password</label><div class="password"><input id="password" name="password" type="{{show ? 'text' : 'password'}}" ng-model="form.password" required><button type="button" ng-click="show=!show">{{show ? 'Hide' : 'Show'}}</button></div></div><p class="alert" ng-if="error">{{error}}</p><button class="button full" type="submit">Sign in</button><p class="auth-switch">Need an account? <a href="#/signup">Create your account</a></p><p class="auth-switch"><a href="#/forgot-password">Forgot your password?</a></p></form></div></section></main>
